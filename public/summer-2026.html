<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>José Pablo Sámano Suárez · Summer 2026</title>
<meta name="description" content="Everything José Pablo Sámano Suárez built in summer 2026: production software at LegalShelf, freelance websites and personal apps.">
<link rel="canonical" href="https://jpsamanosuarez.com/summer-2026">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta property="og:type" content="article">
<meta property="og:title" content="José Pablo Sámano Suárez · Summer 2026">
<meta property="og:description" content="Everything José Pablo Sámano Suárez built in summer 2026: production software at LegalShelf, freelance websites and personal apps.">
<meta property="og:url" content="https://jpsamanosuarez.com/summer-2026">
<meta property="og:image" content="https://jpsamanosuarez.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:oklch(0.975 0.004 268); --raise:oklch(0.993 0.002 268); --sunk:oklch(0.945 0.006 268);
  --ink:oklch(0.21 0.02 268); --ink-2:oklch(0.43 0.018 268); --muted:oklch(0.53 0.014 268);
  --rule:oklch(0.88 0.008 268); --hair:oklch(0.92 0.006 268);
  --cobalt:#2447c9; --on-cobalt:oklch(0.985 0.01 268); --on-cobalt-2:oklch(0.86 0.05 268); --cobalt-line:oklch(0.62 0.16 268 / .55);
  --g-ls:#2447c9; --g-free:#e0692f; --g-per:#14a06f; --live-ink:#0b7a52;
  --link:#2447c9; --frame:oklch(0.21 0.02 268 / .14);
  --shadow:0 1px 1px oklch(0.21 0.02 268 / .05), 0 24px 48px -28px oklch(0.25 0.08 268 / .45);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:oklch(0.17 0.014 268); --raise:oklch(0.205 0.016 268); --sunk:oklch(0.15 0.012 268);
    --ink:oklch(0.95 0.006 268); --ink-2:oklch(0.8 0.012 268); --muted:oklch(0.67 0.014 268);
    --rule:oklch(0.3 0.018 268); --hair:oklch(0.25 0.016 268);
    --cobalt:#1f3db0; --on-cobalt:oklch(0.97 0.01 268); --on-cobalt-2:oklch(0.84 0.05 268); --cobalt-line:oklch(0.6 0.15 268 / .5);
    --g-ls:#5f7ff0; --g-free:#d9733a; --g-per:#1da877; --live-ink:#1da877;
    --link:#8ea6f7; --frame:oklch(0.95 0.006 268 / .14);
    --shadow:0 1px 1px oklch(0 0 0 / .3), 0 24px 48px -26px oklch(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:oklch(0.17 0.014 268); --raise:oklch(0.205 0.016 268); --sunk:oklch(0.15 0.012 268);
  --ink:oklch(0.95 0.006 268); --ink-2:oklch(0.8 0.012 268); --muted:oklch(0.67 0.014 268);
  --rule:oklch(0.3 0.018 268); --hair:oklch(0.25 0.016 268);
  --cobalt:#1f3db0; --on-cobalt:oklch(0.97 0.01 268); --on-cobalt-2:oklch(0.84 0.05 268); --cobalt-line:oklch(0.6 0.15 268 / .5);
  --g-ls:#5f7ff0; --g-free:#d9733a; --g-per:#1da877; --live-ink:#1da877;
  --link:#8ea6f7; --frame:oklch(0.95 0.006 268 / .14);
  --shadow:0 1px 1px oklch(0 0 0 / .3), 0 24px 48px -26px oklch(0 0 0 / .7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
.num,.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"zero" 0}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.02em}
p{margin:0}
a{color:var(--link);text-underline-offset:.18em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:2px}
.shell{width:min(1320px,100%);margin:0 auto;padding:0 clamp(18px,4vw,48px)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(12px,2vw,28px)}
@media (max-width:820px){.g12{grid-template-columns:minmax(0,1fr)}.g12>*{grid-column:1/-1!important}}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none;vertical-align:baseline}
.sw.ls{background:var(--g-ls)} .sw.free{background:var(--g-free)} .sw.personal{background:var(--g-per)}

/* ================= poster ================= */
.poster{background:var(--cobalt);color:var(--on-cobalt);position:relative;overflow:hidden;isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(90deg,var(--cobalt-line) 1px,transparent 1px);
  background-size:calc((min(1320px,100vw) - 2*clamp(18px,4vw,48px) + clamp(12px,2vw,28px))/12) 100%;
  background-position:calc((100vw - min(1320px,100vw))/2 + clamp(18px,4vw,48px)) 0;opacity:.35}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--cobalt-line)}
.p-id{display:flex;flex-direction:column;line-height:1.25}
.p-id b{font-weight:600;font-size:16px}
.p-id span{font-size:14px;color:var(--on-cobalt-2)}
.p-links{display:flex;align-items:center;gap:22px;font-size:14px}
.p-links a{color:var(--on-cobalt);text-decoration:none;border-bottom:1px solid var(--cobalt-line);padding-bottom:1px}
.p-links a:hover{border-bottom-color:var(--on-cobalt)}
.lang{display:inline-flex;gap:2px;border:1px solid var(--cobalt-line);border-radius:6px;padding:2px}
.lang button{font:500 12.5px "Geist Mono",monospace;padding:4px 9px;border-radius:4px;color:var(--on-cobalt-2)}
.lang button[aria-pressed="true"]{background:var(--on-cobalt);color:var(--cobalt)}
.p-main{padding:clamp(40px,7vw,96px) 0 clamp(36px,5vw,64px);align-items:end;row-gap:40px}
.p-title{grid-column:1/8}
.p-title h1{font-size:clamp(84px,14.4vw,210px);line-height:.8;font-weight:700;letter-spacing:-.06em;margin-left:-.05em}
.p-title h1 .l{display:block}
.p-title h1 .l2{color:var(--on-cobalt-2)}
.p-lede{margin-top:clamp(28px,4vw,48px);font-size:clamp(19px,1.6vw,23px);line-height:1.45;max-width:31ch;font-weight:400;letter-spacing:-.01em}
.p-lede strong{font-weight:600}
.p-shots{grid-column:8/13;position:relative;height:clamp(300px,34vw,470px)}
@media (max-width:820px){.p-shots{height:auto;aspect-ratio:5/4}}
.p-shot{position:absolute;margin:0;width:78%;border-radius:6px;overflow:hidden;box-shadow:0 30px 60px -30px oklch(0.12 0.08 268 / .8),0 0 0 1px oklch(1 0 0 / .14)}
.p-shot img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top}
.p-shot figcaption{position:absolute;left:8px;bottom:8px;font:500 11.5px "Geist Mono",monospace;background:oklch(0.16 0.03 268 / .82);color:var(--on-cobalt);padding:3px 7px;border-radius:4px}
.p-shot.s1{right:0;top:0;z-index:1}
.p-shot.s2{left:0;top:30%;z-index:2}
.p-shot.s3{right:6%;bottom:0;z-index:3;width:62%}
.p-index{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--cobalt-line)}
@media (max-width:820px){.p-index{grid-template-columns:repeat(2,minmax(0,1fr))}}
.p-index a{display:flex;flex-direction:column;gap:2px;padding:16px 12px 20px 0;color:var(--on-cobalt);text-decoration:none;font-size:15px;font-weight:500;border-right:1px solid var(--cobalt-line)}
.p-index a:last-child{border-right:0}
.p-index a+a{padding-left:14px}
.p-index a .n{font:500 12px "Geist Mono",monospace;color:var(--on-cobalt-2)}
.p-index a:hover{background:oklch(1 0 0 / .06)}
@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise 1s var(--ease) both;animation-delay:calc(var(--d,0) * 90ms)}
  @keyframes rise{from{transform:translateY(.28em);opacity:.25}to{transform:none;opacity:1}}
  .drift{animation:drift 1.2s var(--ease) both;animation-delay:calc(200ms + var(--d,0) * 120ms)}
  @keyframes drift{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
}

/* ================= sticky bar ================= */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in oklch,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar .shell{display:flex;align-items:center;gap:22px;height:56px}
.bar .who{font-weight:600;font-size:14.5px;white-space:nowrap}
.bar nav{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;font-size:14px}
.bar nav a{color:var(--ink-2);text-decoration:none;white-space:nowrap;padding:4px 0;border-bottom:1.5px solid transparent}
.bar nav a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.bar .lang{border-color:var(--rule)}
.bar .lang button{color:var(--ink-2)}
.bar .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (max-width:620px){.bar .who{display:none}}

/* ================= sections ================= */
.sec{padding:clamp(72px,9vw,128px) 0 0}
.sec-h{align-items:end;margin-bottom:clamp(28px,4vw,48px)}
.sec-h .n{grid-column:1/3;font:600 clamp(56px,7vw,104px)/.8 "Geist",sans-serif;letter-spacing:-.06em;color:var(--cobalt);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .sec-h .n{color:var(--g-ls)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-h .n{color:var(--g-ls)}}
.sec-h .t{grid-column:3/11}
.sec-h h2{font-size:clamp(34px,4.2vw,58px);line-height:1;font-weight:650;letter-spacing:-.04em}
.sec-h p{margin-top:14px;color:var(--ink-2);max-width:62ch}
@media (max-width:820px){.sec-h .n{margin-bottom:10px}}

/* letter */
.letter .aside{grid-column:1/4;color:var(--muted);font-size:14.5px;line-height:1.5}
.letter .aside .sig{margin-top:18px;color:var(--ink);font-weight:600}
.letter .body{grid-column:4/11;display:flex;flex-direction:column;gap:22px;font-size:clamp(19px,1.5vw,22px);line-height:1.5;letter-spacing:-.008em}
.letter .body p{max-width:60ch}
.letter .body .num{font-size:.9em;color:var(--ink);background:var(--sunk);padding:.02em .3em;border-radius:3px}
.letter .body a{color:inherit;text-decoration-color:var(--rule)}
.letter .body a:hover{text-decoration-color:var(--link)}
.split{grid-column:4/13;margin-top:clamp(36px,5vw,56px)}
.split .barline{display:flex;height:14px;gap:2px}
.split .barline span{height:100%}
.split .barline span:first-child{border-radius:2px 0 0 2px}.split .barline span:last-child{border-radius:0 2px 2px 0}
.split .keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;gap:18px}
@media (max-width:620px){.split .keys{grid-template-columns:1fr}}
.split .key{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 10px;font-size:14.5px}
.split .key .sw{margin-top:6px}
.split .key b{font-weight:600}
.split .key span.d{grid-column:2;color:var(--muted);font-size:13.5px}

/* timeline */
.tl-head{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
.tl-head span{display:inline-flex;align-items:center;gap:8px}
.ramp-sw{width:40px;height:8px;border-radius:2px;background:linear-gradient(90deg,color-mix(in oklch,var(--ink-2) 20%,transparent),var(--ink-2))}
.hatch-sw{width:18px;height:8px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--ink-2) 0 1.5px,transparent 1.5px 4px)}
.tl-scroll{overflow-x:auto;margin:0 calc(-1*clamp(18px,4vw,48px));padding:0 clamp(18px,4vw,48px)}
.tl{min-width:760px;position:relative;--lw:210px}
.tl-axis,.tl-row{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);align-items:center}
.tl-axis{height:28px;border-bottom:1px solid var(--rule)}
.tl-axis .ticks{position:relative;height:100%}
.tl-axis .ticks span{position:absolute;bottom:6px;font:500 12px "Geist Mono",monospace;color:var(--muted);padding-left:6px;border-left:1px solid var(--rule);line-height:1}
.tl-g{padding:16px 0 6px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.tl-row{height:32px;border-bottom:1px solid var(--hair)}
.tl-row .lab{text-align:left;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px;height:100%;color:var(--ink)}
.tl-row .lab:hover{color:var(--link)}
.track{position:relative;height:16px;background:repeating-linear-gradient(90deg,var(--hair) 0 1px,transparent 1px calc(100%/18))}
.span{position:absolute;top:0;bottom:0;border-radius:2px}
.span.git{background:color-mix(in oklch,var(--c) 13%,transparent)}
.span.nogit{background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,color-mix(in oklch,var(--c) 16%,transparent) 1.5px 4px);min-width:5px}
.cell{position:absolute;top:1px;bottom:1px;border-radius:2px;background:var(--c)}
.cursor{position:absolute;top:28px;bottom:0;left:var(--lw);width:calc((100% - var(--lw))/18);background:color-mix(in oklch,var(--link) 8%,transparent);border-left:1.5px solid var(--link);pointer-events:none;transition:transform .35s var(--ease)}
.scrub{margin-top:28px;align-items:start;row-gap:22px}
.scrub .ctl{grid-column:1/6}
.scrub .out{grid-column:7/13}
.scrub label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:10px}
.scrub input[type=range]{width:100%;accent-color:var(--cobalt)}
.scrub .wk{font-size:clamp(28px,3vw,40px);font-weight:650;letter-spacing:-.035em;line-height:1.05;margin-top:14px}
.scrub .wk small{display:block;font-size:15px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:6px}
.act{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
@media (max-width:620px){.act{columns:1}}
.act li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--hair);font-size:14.5px;break-inside:avoid}
.act li .num{font-size:13px;color:var(--ink-2)}
.act li.none{grid-template-columns:1fr;color:var(--muted)}

/* work */
.filters{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 28px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.fset{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14.5px}
.fbtn{color:var(--ink-2);padding:4px 0;border-bottom:1.5px solid transparent;display:inline-flex;align-items:center;gap:7px}
.fbtn:hover{color:var(--ink)}
.fbtn[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:550}
.fbtn .c{font:500 12px "Geist Mono",monospace;color:var(--muted)}
.fsep{width:1px;align-self:stretch;background:var(--rule)}
.count{margin-left:auto;font:500 13px "Geist Mono",monospace;color:var(--muted)}
.log{list-style:none;margin:0;padding:0}
.entry{border-bottom:1px solid var(--rule);padding:clamp(26px,3vw,40px) 0;align-items:start;row-gap:18px}
.entry .when{grid-column:1/3;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted);padding-top:6px}
.entry .when .d{font:500 13px "Geist Mono",monospace;color:var(--ink-2)}
.entry .when .th{display:inline-flex;align-items:center;gap:8px}
.entry .txt{grid-column:3/8;display:flex;flex-direction:column;gap:12px}
.entry.compact{padding:18px 0;row-gap:10px}
.entry.compact .when{padding-top:3px}
.entry.compact .txt{grid-column:3/10;gap:6px}
.entry.compact .tag{font-size:15.5px}
.entry .cta{grid-column:10/13;justify-self:end;align-self:start}
.entry.compact .more{margin-top:0}
@media (max-width:820px){.entry .cta{justify-self:start}}
.log .grp{display:flex;align-items:center;gap:10px;padding:clamp(36px,4vw,56px) 0 12px;border-bottom:1px solid var(--ink);font-size:15px;font-weight:600}
.log .grp:first-child{padding-top:18px}
.log .grp .num{font-size:13px;color:var(--muted);font-weight:500}
.entry h3{font-size:clamp(28px,2.8vw,40px);line-height:1;letter-spacing:-.035em;font-weight:680;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.entry.compact h3{font-size:21px;letter-spacing:-.02em}
.entry h3 .live{font:500 12px "Geist Mono",monospace;letter-spacing:0;color:var(--live-ink);display:inline-flex;align-items:center;gap:6px}
.entry h3 .live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in oklch,currentColor 22%,transparent)}
.entry .tag{color:var(--ink-2);max-width:56ch}
.entry .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 13px "Geist Mono",monospace;color:var(--ink-2)}
.entry .facts b{color:var(--ink);font-weight:500}
.entry .more{align-self:flex-start;margin-top:4px;font-size:14.5px;font-weight:550;color:var(--ink);display:inline-flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1.5px solid var(--ink)}
.entry .more:hover{color:var(--link);border-bottom-color:var(--link)}
.entry .more .ch{transition:transform .4s var(--ease);display:inline-block}
.entry.open .more .ch{transform:rotate(45deg)}
.entry .media{grid-column:8/13}
.entry .media figure{margin:0;border-radius:6px;overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--frame);transition:transform .6s var(--ease)}
.entry:hover .media figure{transform:translateY(-3px)}
.entry .media img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.entry .media .cap{margin-top:10px;font:500 12.5px "Geist Mono",monospace;color:var(--muted)}
.entry .media .cap a{color:var(--muted)}
.entry .media svg{display:block;width:100%;height:auto}
.detail{grid-column:3/13;display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.entry.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.detail .in{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));column-gap:clamp(12px,2vw,28px);row-gap:26px;padding-top:12px}
@media (max-width:820px){.detail .in{grid-template-columns:1fr}.detail .in>*{grid-column:1/-1!important}}
.detail h4{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-bottom:8px}
.detail .prob{grid-column:1/6}
.detail .out{grid-column:6/11}
.detail .built{grid-column:1/8}
.detail .side{grid-column:8/11;display:flex;flex-direction:column;gap:22px}
.detail p{max-width:58ch}
.detail ol{margin:0;padding:0;list-style:none;counter-reset:b}
.detail ol li{counter-increment:b;display:grid;grid-template-columns:34px minmax(0,1fr);padding:10px 0;border-top:1px solid var(--hair);max-width:66ch}
.detail ol li::before{content:counter(b,decimal-leading-zero);font:500 12.5px "Geist Mono",monospace;color:var(--muted);padding-top:4px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.metrics div b{display:block;font-size:24px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.metrics div span{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{font:500 12px "Geist Mono",monospace;padding:3px 8px;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2)}
.empty{padding:48px 0;color:var(--muted)}

/* evidence */
.ev-chart{position:relative}
.ev-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;margin-bottom:12px}
.ev-top h3{font-size:20px;letter-spacing:-.02em}
.ev-top .sub{font-size:14px;color:var(--muted);margin-top:2px}

 en:{role:"Software engineer, Mexico City", portfolio:"Portfolio", h1a:"Summer",
  lede:x=>`<strong>${x.projects} projects</strong> between May and September: a compliance platform running in production, a legal-verification product ready for its pilot, and the sites and tools around them.`,
  idx:["Letter","Timeline","Work","Evidence","Method"],
  s1:"A letter on the summer", asideA:"Written on my last day in the office, 11 September 2026.", asideB:"Every figure on this page comes from git history or the projects themselves.",
  letter:x=>[
   `I spent the summer at LegalShelf, a legal-tech company in Mexico City. I built <a href="#e-checkwise">CheckWise</a>, a platform that proves every service provider is compliant with Mexico's REPSE outsourcing rules, and ran it in production from its first commit in May: <span class="num">${x.cw}</span> commits, <span class="num">667</span> merged pull requests, and more than <span class="num">7,800</span> automated tests guarding every release.`,
   `In late July I started <a href="#e-verifaid">Verifaid</a>. It reads a borrower's articles of incorporation and notarial powers, then tells a lender who can sign, how, and within what limits, citing the exact page. It went from an empty repository to a controlled pilot in six weeks. Alongside both products I rebuilt <a href="#e-ls-site">the company's website</a> and delivered five tools for clients, including AI pipelines that organized <span class="num">${x.docs}</span> legal documents.`,
   `Outside the office I rebuilt <a href="#e-imjus">a civil-society organization's website</a>, gave a talk on AI in legal practice, and built apps for my fantasy league and my family. Most of this code was written by AI agents under my direction. <a href="#method">Section 05</a> describes the system that made that safe.`],
  splitL:"Where the commits went", groups:{ls:"LegalShelf",free:"Freelance",personal:"Personal"},
  gd:{ls:"Platforms, website, client tools", free:"Websites, a talk, an audit", personal:"League, family, portfolio"},

  c1:"Commits per week, by thread", c1s:"11 May to 11 September 2026", modeAbs:"Commits", modePct:"Share", c2:"Commits by project", c2s:"Projects with a git history", c3:"Technologies", c3s:"Projects that used each one",
  asTable:"View as a table", thWeek:"Week of", thTotal:"Total", thProject:"Project", thThread:"Thread", thCommits:"Commits", thTech:"Technology", thProjects:"Projects",
  s5:"How I work",
  mLead:`Most of this summer's code was written by Claude Code agents. I treat that as <em>an engineering discipline</em>, not a shortcut: I design the system, and the system keeps the speed safe.`,
  mNote:"The agents supply speed. Briefs, isolation, gates and memory decide what reaches production, and I decide when it ships.",
  loop:[["Direct","I scope the change, write the brief and fix the constraints before any code exists."],["Isolate","Each agent works in its own git worktree, so parallel sessions never overwrite each other."],["Gate","Nothing merges without tests, type checks, coverage ratchets and CI on self-hosted runners."],["Remember","A searchable knowledge base of every lesson and trap, recalled automatically at the start of each task."],["Automate","An autonomous shift every six hours finds, fixes and proves bugs, then asks for merge approval in Slack."],["Ship","I review and authorize the merge. The main branch deploys to production."]],
  loopNote:"Steps 04 and 05 run without me. Every session writes what it learned back to step 04.",
  mFacts:`<span class="num">98%</span> of CheckWise commits were co-authored with Claude, checked by <span class="num">7,800+</span> automated tests on <span class="num">4</span> self-hosted CI runners, with <span class="num">5</span> scheduled agent routines running on their own.`,
  footBig:`Want the detail behind any of this? <a href="https://jpsamanosuarez.com" target="_blank" rel="noopener">See my portfolio</a>.`,

 es:{role:"Ingeniero de software, Ciudad de México", portfolio:"Portafolio", h1a:"Verano",
  lede:x=>`<strong>${x.projects} proyectos</strong> entre mayo y septiembre: una plataforma de cumplimiento en producción, un producto de verificación legal listo para su piloto, y los sitios y herramientas a su alrededor.`,
  idx:["Carta","Línea de tiempo","Trabajo","Evidencia","Método"],
  s1:"Una carta sobre el verano", asideA:"Escrita en mi último día en la oficina, el 11 de septiembre de 2026.", asideB:"Cada cifra de esta página sale del historial de git o de los propios proyectos.",
  letter:x=>[
   `Pasé el verano en LegalShelf, una empresa legal-tech de la Ciudad de México. Construí <a href="#e-checkwise">CheckWise</a>, una plataforma que demuestra que cada proveedor cumple con el REPSE, y la operé en producción desde su primer commit en mayo: <span class="num">${x.cw}</span> commits, <span class="num">667</span> pull requests fusionados y más de <span class="num">7,800</span> pruebas automatizadas protegiendo cada versión.`,
   `A finales de julio empecé <a href="#e-verifaid">Verifaid</a>. Lee la escritura constitutiva y los poderes del acreditado y le dice al acreedor quién puede firmar, cómo y con qué límites, citando la página exacta. Pasó de un repositorio vacío a un piloto controlado en seis semanas. Junto a ambos productos reconstruí <a href="#e-ls-site">el sitio de la empresa</a> y entregué cinco herramientas para clientes, incluidos pipelines con IA que organizaron <span class="num">${x.docs}</span> documentos legales.`,
   `Fuera de la oficina reconstruí <a href="#e-imjus">el sitio de una organización de la sociedad civil</a>, di una plática sobre IA en la práctica legal y construí apps para mi liga de fantasy y mi familia. La mayor parte de este código la escribieron agentes de IA bajo mi dirección. <a href="#method">La sección 05</a> describe el sistema que lo hizo seguro.`],
  splitL:"A dónde se fueron los commits", groups:{ls:"LegalShelf",free:"Freelance",personal:"Personal"},

  $("#pBars").innerHTML=ps.map(p=>`<div class="hb"><button class="nm" type="button" data-go="${p.id}" style="text-align:left">${esc(p.name)}</button><span class="tr"><span class="bb" style="width:${Math.max(.5,p.commits/mx*86)}%;background:${col(p.group)}"></span><span class="v">${fmt(p.commits)}</span></span></div>`).join("");
  $("#pTbl").innerHTML=`<table><thead><tr><th>${t("thProject")}</th><th>${t("thThread")}</th><th class="n">${t("thCommits")}</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${t("groups")[p.group]}</td><td class="n">${fmt(p.commits)}</td></tr>`).join("")}</tbody></table>`;
  const st=DATA.stack, sm=st[0][1];
  $("#tBars").innerHTML=st.map(([k,v])=>`<div class="hb"><span class="nm">${esc(k)}</span><span class="tr"><span class="bb" style="width:${v/sm*86}%;background:var(--ink-2)"></span><span class="v">${v}</span></span></div>`).join("");
  $("#tTbl").innerHTML=`<table><thead><tr><th>${t("thTech")}</th><th class="n">${t("thProjects")}</th></tr></thead><tbody>${st.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")}</tbody></table>`;
}
function method(){ $("#loop").innerHTML=t("loop").map(([h,p],i)=>`<li><div class="node"><b>0${i+1}</b><i></i></div><h3>${h}</h3><p>${p}</p></li>`).join(""); }
function all(){ statics(); split(); timeline(); filters(); work(); weekly(); bars(); method(); }
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang; try{localStorage.setItem("jps-lang",lang);}catch(e){} all();}));
let rz; new ResizeObserver(()=>{clearTimeout(rz); rz=setTimeout(()=>{weekly(); $("#tl").style.setProperty("--lw",(innerWidth<700?140:210)+"px"); scrub();},90);}).observe(document.body);
all();
</script>
